name: Build & Release Flutter APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f apk/android/gradlew ]; then
            chmod +x apk/android/gradlew
          fi

      - name: Ensure Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Ensure .env Asset Exists
        working-directory: ./apk
        run: |
          if [ ! -f .env ]; then
            echo "NEON_CONNECTION_STRING=\"postgresql://neondb_owner:npg_OtyTj7F9Aqnz@ep-red-sea-b5yphk96-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require\"" > .env
            echo "NEON_REGION_ENDPOINT=\"https://ep-red-sea-b5yphk96.c-7.us-east-2.aws.neon.tech/sql\"" >> .env
            echo "NEON_DIRECT_ENDPOINT=\"https://ep-red-sea-b5yphk96.c-7.us-east-2.aws.neon.tech/sql\"" >> .env
          fi

      - name: Check Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: ./apk
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./apk
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        id: prepare_release
        run: |
          mkdir -p release_assets
          cp apk/build/app/outputs/flutter-apk/app-release.apk release_assets/merkato-credit-record-release.apk
          
          # Compute Tag
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.$(date +'%Y%m%d%H%M')"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Upload Release Asset to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_release.outputs.tag }}
          name: "Merkato Credit Record ${{ steps.prepare_release.outputs.tag }}"
          body: |
            ## 📱 Merkato Credit Record Android Release (${{ steps.prepare_release.outputs.tag }})

            Android application release for multi-shop credit and stock ledger.

            ### ✨ Highlights in this release:
            - **Modern Accounting Schema**: Customer Credit, Supplier Credit, and Stock & Inventory.
            - **Web-Aligned Form Dialog**: Dynamic Debit (+ Goods) and Credit (- Payment via CBE, Cash, Awash, Telebirr) channel selector.
            - **Cartons & Packaging Breakdown**: Auto-calculates `Ctns × Pcs/Ctn = Total Units` in real-time.
            - **Dual Layout Options**: Toggle between Compact Card view and horizontal-scrolling Excel Grid view.
            - **Offline-First & Neon DB**: Cloud database sync with local offline fallback.

            ### 📥 Download
            Download **`merkato-credit-record-release.apk`** below and open on your Android device to install.
          files: release_assets/merkato-credit-record-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
